name: 🇨🇲 Build MRC Renaissance APK

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Tag de version (ex: v1.0.0)'
        required: false

jobs:
  build-apk:
    name: Build Debug APK
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: ☕ Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: 🔑 Grant gradlew execute permission
        run: chmod +x android/gradlew

      - name: 🧹 Clean previous build
        run: cd android && ./gradlew clean --no-daemon

      - name: 🔨 Build Debug APK
        run: cd android && ./gradlew assembleDebug --no-daemon --stacktrace

      - name: 📦 Upload APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: MRC-Renaissance-App-Debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: 🚀 Create GitHub Release (on version tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v1
        with:
          files: android/app/build/outputs/apk/debug/app-debug.apk
          name: "MRC Renaissance App ${{ github.ref_name }}"
          body: |
            ## 🇨🇲 Application Officielle MRC - Mouvement pour la Renaissance du Cameroun
            
            ### Nouveautés ${{ github.ref_name }}
            - Direction nationale mise à jour (Convention Extraordinaire 17 Octobre 2026)
            - Présidente Tiriane Balbine Noah (96,89%)
            - Directoire national complet
            - Carte de membre 3D interactive
            - Base de données membres persistante
            
            ### Installation
            1. Téléchargez `app-debug.apk`
            2. Activez **Sources inconnues** dans vos paramètres Android
            3. Installez l'APK
            
            **Site officiel :** https://mrcparty.net
          draft: false
          prerelease: false
